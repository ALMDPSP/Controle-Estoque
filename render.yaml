# Blueprint do Render — permite criar o serviço web + banco de dados
# de uma vez, usando "New +" > "Blueprint" no painel do Render e
# apontando para este repositório do GitHub.
#
# Se preferir, você também pode criar tudo manualmente pelo painel do
# Render (New + > PostgreSQL, depois New + > Web Service) — os passos
# estão no LEIA-ME.txt. Os nomes de campos abaixo podem mudar com o
# tempo; confira o painel do Render se o deploy do Blueprint falhar.

databases:
  - name: estoque-db
    plan: free          # troque para "basic-256mb" (pago) quando for usar de verdade,
                         # porque o banco gratuito do Render expira 30 dias depois de criado

services:
  - type: web
    name: controle-estoque
    runtime: python
    plan: free           # troque para "starter" (pago, ~$7/mês) para não "dormir"
                          # depois de 15 minutos sem acesso
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-db
          property: connectionString
