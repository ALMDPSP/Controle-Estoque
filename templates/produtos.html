<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cadastro de Produtos</title>
<style>
:root{--bg:#12181f;--panel:#1a2029;--panel-2:#212934;--line:#2b3444;--text:#e7ebf1;--muted:#8b96a8;--accent:#3ea6ff;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Inter,system-ui,sans-serif}header{padding:28px 32px 18px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:13px}.nav{padding:10px 32px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav-link{padding:6px 14px;border-radius:20px;font-size:13px;text-decoration:none;border:1px solid var(--line);color:var(--muted)}.nav-link.ativo{background:var(--accent);color:#08131f;border-color:var(--accent);font-weight:600}main{padding:26px 32px 60px;max-width:1100px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:24px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 16px}form{display:grid;grid-template-columns:1fr 2fr auto;gap:14px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--text);font-size:14px;outline:none}input:focus{border-color:var(--accent)}button{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer}.primary{background:var(--accent);color:#08131f;border-color:var(--accent);font-weight:600}.danger{color:var(--danger)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase}.codigo{font-family:Consolas,monospace;color:var(--accent)}.acoes{display:flex;gap:7px}@media(max-width:760px){form{grid-template-columns:1fr}.acoes{flex-wrap:wrap}}
</style></head><body>
<header><h1>Cadastro de Produtos</h1><p>Cadastre o código mestre do item e sua descrição. Esses dados serão usados automaticamente em Estoque e Imobilizados.</p></header>
<nav class="nav"><a class="nav-link" href="{{ url_for('index') }}">Estoque</a><a class="nav-link" href="{{ url_for('pagina_imobilizados') }}">Imobilizados</a><a class="nav-link ativo" href="{{ url_for('pagina_produtos') }}">Cadastro de Produtos</a><span style="margin-left:auto;color:var(--muted);font-size:13px">Logado como <strong style="color:var(--text)">{{ username }}</strong></span><a class="nav-link" href="{{ url_for('logout') }}">Sair</a></nav>
<main><section class="panel"><h2>Novo produto</h2><form id="produto-form"><div class="field"><label>Código de cadastro do item *</label><input id="produto-codigo" required placeholder="Ex.: EQP-0231"></div><div class="field"><label>Descrição *</label><input id="produto-descricao" required placeholder="Ex.: Notebook Dell"></div><button class="primary" type="submit">Cadastrar produto</button></form></section>
<section class="panel"><h2>Produtos cadastrados</h2><table><thead><tr><th>Código</th><th>Descrição</th><th>Cadastrado por</th><th>Ações</th></tr></thead><tbody id="produtos-tbody"></tbody></table></section></main>
<script>let produtos=[];async function carregar(){const r=await fetch('/api/produtos');produtos=await r.json();render()}function render(){const t=document.getElementById('produtos-tbody');t.innerHTML='';produtos.forEach(p=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="codigo">${esc(p.codigo)}</td><td>${esc(p.descricao)}</td><td>${esc(p.criado_por||'')}</td><td><div class="acoes"><button onclick="editar(${p.id})">Editar</button><button class="danger" onclick="excluir(${p.id})">Excluir</button></div></td>`;t.appendChild(tr)})}function esc(v){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}document.getElementById('produto-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/produtos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:document.getElementById('produto-codigo').value,descricao:document.getElementById('produto-descricao').value})});if(r.ok){e.target.reset();carregar()}else{const x=await r.json();alert(x.erro||'Erro ao cadastrar')}});async function editar(id){const p=produtos.find(x=>x.id===id);if(!p)return;const codigo=prompt('Código de cadastro do item:',p.codigo);if(codigo===null)return;const descricao=prompt('Descrição:',p.descricao);if(descricao===null)return;const r=await fetch('/api/produtos/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo,descricao})});if(r.ok)carregar();else{const x=await r.json();alert(x.erro||'Erro ao editar')}}async function excluir(id){const p=produtos.find(x=>x.id===id);if(!confirm('Excluir o produto '+(p?p.codigo:'')+'? Os itens já cadastrados não serão apagados.'))return;const r=await fetch('/api/produtos/'+id,{method:'DELETE'});if(r.ok)carregar();else{const x=await r.json();alert(x.erro||'Erro ao excluir')}}carregar();</script></body></html>
