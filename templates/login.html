<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Controle de Estoque</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#141b24; --line:rgba(255,255,255,.08);
    --text:#eef2f7; --muted:#8b96a8; --accent:#3ea6ff; --accent-2:#5ef2d6; --danger:#ff6b6b;
    --mono:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow-x:hidden;
  }

  /* ---------- Fundo: aurora + grade ---------- */
  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(80px); opacity:.22;
    animation:flutuar 14s ease-in-out infinite;
  }
  .aurora span:nth-child(1){
    width:480px; height:480px; background:#3ea6ff; top:-180px; left:-120px;
    animation-delay:0s;
  }
  .aurora span:nth-child(2){
    width:420px; height:420px; background:#5ef2d6; bottom:-160px; right:-100px;
    animation-delay:-5s;
  }
  .aurora span:nth-child(3){
    width:320px; height:320px; background:#8a5ef2; top:40%; left:60%;
    animation-delay:-9s; opacity:.2;
  }
  @keyframes flutuar{
    0%, 100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-30px) scale(1.08);}
  }
  .grade{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 40%, transparent 85%);
  }

  /* ---------- Cartão ---------- */
  .card{
    position:relative; z-index:1;
    width:min(400px, 100%);
    background:rgba(16,21,29,.97);
    border:1px solid var(--line);
    border-radius:16px;
    padding:38px 34px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02) inset;
    animation:subir-fade .5s ease-out both;
  }
  @keyframes subir-fade{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .card::before{
    content:''; position:absolute; inset:-1px; z-index:-1; border-radius:17px;
    padding:1px;
    background:linear-gradient(135deg, rgba(62,166,255,.5), rgba(94,242,214,.15) 40%, transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }

  .logo-linha{display:flex; align-items:center; gap:12px; margin-bottom:28px;}
  .logo-icone{
    position:relative; width:42px; height:42px; flex-shrink:0;
    border-radius:11px;
    background:linear-gradient(145deg, #1a2432, #0e141c);
    border:1px solid rgba(62,166,255,.35);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.02) inset, 0 0 22px rgba(62,166,255,.25);
  }
  .logo-icone::after{
    content:''; position:absolute; inset:-1px; border-radius:12px;
    box-shadow:0 0 16px 2px rgba(62,166,255,.35);
    animation:pulsar 2.6s ease-in-out infinite;
  }
  @keyframes pulsar{0%,100%{opacity:.5;} 50%{opacity:1;}}
  .logo-icone svg{width:21px; height:21px; position:relative;}

  .marca-texto{font-size:15px; font-weight:700; letter-spacing:-.005em; color:var(--text);}
  .marca-texto span{
    display:block; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
    color:var(--accent-2); text-transform:uppercase; margin-top:2px; font-weight:600;
  }

  h1{
    font-size:21px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em;
    background:linear-gradient(90deg, #eef2f7, #b9d9ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--muted); font-size:13px; margin:0 0 26px;}

  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:16px;}
  .field label{font-size:12px; color:var(--muted); font-weight:500; letter-spacing:.01em;}
  .campo-wrap{position:relative;}
  .campo-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:#5b6577; pointer-events:none;
    transition:color .15s;
  }
  .field input{
    width:100%; background:rgba(10,14,20,.6); border:1px solid var(--line); border-radius:9px;
    padding:12px 13px 12px 38px; color:var(--text); font-size:14.5px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .field input::placeholder{color:#4c5769;}
  .field input:focus{
    border-color:var(--accent); background:rgba(10,14,20,.85);
    box-shadow:0 0 0 3px rgba(62,166,255,.15), 0 0 18px rgba(62,166,255,.12);
  }
  .field input:focus ~ svg, .campo-wrap:focus-within svg{color:var(--accent);}

  button{
    width:100%; margin-top:10px; position:relative; overflow:hidden;
    background:linear-gradient(90deg, var(--accent), #2fd7c4);
    color:#06121f; border:none; border-radius:9px; padding:13px; font-size:14.5px; font-weight:700;
    cursor:pointer; transition:transform .12s, box-shadow .12s;
    box-shadow:0 6px 20px rgba(62,166,255,.3);
    letter-spacing:.01em;
  }
  button:hover{transform:translateY(-1px); box-shadow:0 8px 26px rgba(62,166,255,.42);}
  button:active{transform:translateY(0);}
  button:focus-visible, .field input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .erro{
    background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.3);
    color:var(--danger); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:18px;
    display:flex; align-items:center; gap:8px;
  }

  .credito{
    text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--line);
    font-size:10.5px; letter-spacing:.03em; color:#5b6577;
  }
  .credito strong{color:var(--accent-2); font-weight:600;}

  @media (max-width: 420px){
    .card{padding:30px 24px 24px;}
  }
</style>
</head>
<body>

  <div class="aurora"><span></span><span></span><span></span></div>
  <div class="grade"></div>

  <div class="card">
    <div class="logo-linha">
      <div class="logo-icone">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#3ea6ff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3 7L12 12L21 7" stroke="#5ef2d6" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 12V22" stroke="#3ea6ff" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="marca-texto">Controle de Ativos<span>Sistema interno</span></div>
    </div>

    <h1>Acessar o sistema</h1>
    <p class="sub">Entre com suas credenciais para continuar.</p>

    {% if erro %}<div class="erro">⚠ {{ erro }}</div>{% endif %}

    <form method="POST">
      <div class="field">
        <label for="username">Usuário</label>
        <div class="campo-wrap">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.2"/>
            <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/>
          </svg>
          <input id="username" name="username" placeholder="seu.usuario" autofocus required>
        </div>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <div class="campo-wrap">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8">
            <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit">Entrar</button>
    </form>

    <div class="credito">© 2026 · Todos os direitos reservados · Developed by <strong>Alexandre Martins</strong></div>
  </div>

</body>
</html>
