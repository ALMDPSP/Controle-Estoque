<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Controle de Estoque</title>

<style>
:root{
  --bg:#080b10;
  --panel:#10151d;
  --line:rgba(255,255,255,.09);
  --text:#eef2f7;
  --muted:#8b96a8;
  --accent:#3ea6ff;
  --accent-2:#5ef2d6;
  --danger:#ff6b6b;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}

*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

/* =========================================================
   FUNDO
========================================================= */

.aurora{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

.aurora span{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:.22;
  animation:flutuar 16s ease-in-out infinite;
}

.aurora span:nth-child(1){
  width:520px;
  height:520px;
  background:#3ea6ff;
  top:-200px;
  left:-140px;
}

.aurora span:nth-child(2){
  width:460px;
  height:460px;
  background:#5ef2d6;
  bottom:-180px;
  right:-120px;
  animation-delay:-6s;
}

.aurora span:nth-child(3){
  width:340px;
  height:340px;
  background:#8a5ef2;
  top:35%;
  left:55%;
  animation-delay:-11s;
  opacity:.14;
}

@keyframes flutuar{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(30px,-30px) scale(1.08)}
}

.grade{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;

  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);

  background-size:44px 44px;

  mask-image:
    radial-gradient(
      ellipse 75% 65% at 50% 45%,
      black 40%,
      transparent 88%
    );
}

/* =========================================================
   PARTÍCULAS
========================================================= */

.particula{
  position:fixed;
  z-index:0;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px 1px rgba(62,166,255,.7);
  animation:subir-particula linear infinite;
  opacity:0;
}

@keyframes subir-particula{
  0%{
    transform:translateY(0);
    opacity:0;
  }

  10%{opacity:.7}
  90%{opacity:.5}

  100%{
    transform:translateY(-100vh);
    opacity:0;
  }
}

/* =========================================================
   CARD
========================================================= */

.envoltorio{
  position:relative;
  z-index:1;
  width:min(920px,100%);
  animation:subir-fade .5s ease-out both;
}

@keyframes subir-fade{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card{
  position:relative;
  display:flex;

  background:rgba(14,19,27,.98);

  border:1px solid var(--line);
  border-radius:18px;

  box-shadow:0 24px 70px rgba(0,0,0,.55);

  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:20;
  padding:1.5px;
  border-radius:18px;

  background:
    conic-gradient(
      from 0deg,
      transparent 0%,
      rgba(62,166,255,.9) 8%,
      transparent 20%,
      transparent 100%
    );

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

  -webkit-mask-composite:xor;
  mask-composite:exclude;

  animation:girar 4.5s linear infinite;
  pointer-events:none;
}

@keyframes girar{
  to{transform:rotate(360deg)}
}

/* =========================================================
   PAINEL DO CENTRO DE DISTRIBUIÇÃO
========================================================= */

.console{
  position:relative;
  flex:1.15 1 0;
  min-width:450px;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(62,166,255,.10),
      transparent 55%
    ),
    linear-gradient(160deg,#0c1119,#080b10);

  border-right:1px solid var(--line);

  padding:28px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.cd-topo{
  position:relative;
  z-index:30;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.cd-status{
  display:flex;
  align-items:center;
  gap:9px;
}

.console-luz{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#3a4453;
}

.console-luz.verde{
  background:var(--accent-2);
  box-shadow:0 0 8px rgba(94,242,214,.7);
  animation:pulsar 1.8s ease-in-out infinite;
}

@keyframes pulsar{
  0%,100%{opacity:.5}
  50%{opacity:1}
}

.cd-status-text{
  font-family:var(--mono);
  font-size:10px;
  color:var(--muted);
  letter-spacing:.08em;
}

.cd-live{
  font-family:var(--mono);
  font-size:9px;
  color:var(--accent-2);
  letter-spacing:.08em;
  animation:live-piscar 1.5s infinite;
}

@keyframes live-piscar{
  0%,100%{opacity:.45}
  50%{opacity:1}
}

/* =========================================================
   CENA
========================================================= */

.cd-cena{
  position:relative;
  flex:1;
  min-height:410px;
  margin-top:4px;
  overflow:hidden;
}

/* chão */

.cd-cena::before{
  content:"";

  position:absolute;

  left:-25%;
  right:-25%;
  bottom:5px;

  height:155px;

  background:
    linear-gradient(
      rgba(62,166,255,.06) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(62,166,255,.06) 1px,
      transparent 1px
    );

  background-size:28px 28px;

  transform:
    perspective(180px)
    rotateX(58deg);

  transform-origin:bottom;

  opacity:.7;
}

/* linha luminosa */

.cd-cena::after{
  content:"";

  position:absolute;

  left:-20%;
  right:-20%;
  bottom:60px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(62,166,255,.45),
      rgba(94,242,214,.4),
      transparent
    );

  box-shadow:0 0 18px rgba(62,166,255,.2);
}

/* =========================================================
   GALPÃO
========================================================= */

.cd-predio{
  position:absolute;

  width:390px;
  height:245px;

  left:50%;
  top:26px;

  transform:translateX(-50%);

  z-index:2;
}

.cd-telhado{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:24px;

  background:
    linear-gradient(
      180deg,
      #22364c,
      #111c2a
    );

  border:1px solid rgba(62,166,255,.35);

  transform:skewX(-20deg);

  box-shadow:
    0 0 25px rgba(62,166,255,.14);
}

.cd-fachada{
  position:absolute;

  top:22px;
  left:8px;

  width:374px;
  height:215px;

  background:
    linear-gradient(
      90deg,
      rgba(62,166,255,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      #121c27,
      #080e15
    );

  background-size:35px 35px;

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    0 20px 45px rgba(0,0,0,.55),
    inset 0 0 40px rgba(62,166,255,.05);
}

/* =========================================================
   PARTE SUPERIOR DO GALPÃO
========================================================= */

.cd-logo-predio{
  position:absolute;

  top:16px;
  left:22px;

  display:flex;
  flex-direction:column;

  font-family:var(--mono);
}

.cd-logo-predio span{
  font-size:24px;
  font-weight:700;

  color:var(--accent);

  text-shadow:
    0 0 15px rgba(62,166,255,.55);
}

.cd-logo-predio small{
  font-size:7px;
  color:var(--accent-2);
  letter-spacing:.18em;
}

/* luzes */

.cd-luzes{
  position:absolute;

  top:24px;
  right:22px;

  display:flex;
  gap:8px;
}

.cd-luzes i{
  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--accent-2);

  box-shadow:
    0 0 9px rgba(94,242,214,.8);

  animation:luz-cd 2s ease-in-out infinite;
}

.cd-luzes i:nth-child(2){animation-delay:.25s}
.cd-luzes i:nth-child(3){animation-delay:.5s}
.cd-luzes i:nth-child(4){animation-delay:.75s}
.cd-luzes i:nth-child(5){animation-delay:1s}

@keyframes luz-cd{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* =========================================================
   PRATELEIRAS
========================================================= */

.prateleiras{
  position:absolute;

  left:20px;
  top:66px;

  width:205px;
  height:105px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.prateleira{
  position:relative;

  height:28px;

  border-bottom:3px solid #31445a;

  background:
    linear-gradient(
      90deg,
      rgba(62,166,255,.08),
      transparent
    );
}

.prateleira::before,
.prateleira::after{
  content:"";

  position:absolute;

  bottom:-3px;

  width:3px;
  height:28px;

  background:#26384d;
}

.prateleira::before{
  left:8px;
}

.prateleira::after{
  right:8px;
}

/* caixas nas prateleiras */

.estoque-caixa{
  position:absolute;

  width:22px;
  height:17px;

  bottom:5px;

  border:1px solid rgba(62,166,255,.4);

  background:
    linear-gradient(
      135deg,
      #1b3b58,
      #0d1c2b
    );

  box-shadow:
    0 0 7px rgba(62,166,255,.08);
}

.c1{left:25px}
.c2{left:52px}
.c3{left:82px}
.c4{left:115px}
.c5{left:145px}
.c6{left:174px}

.p1 .estoque-caixa:nth-child(1){animation:piscar-caixa 3s infinite}
.p2 .estoque-caixa:nth-child(2){animation:piscar-caixa 3s 1s infinite}
.p3 .estoque-caixa:nth-child(3){animation:piscar-caixa 3s 2s infinite}

@keyframes piscar-caixa{
  0%,100%{
    filter:brightness(.8);
  }

  50%{
    filter:brightness(1.5);
  }
}

/* =========================================================
   EMPILHADEIRA
========================================================= */

.empilhadeira{
  position:absolute;

  width:72px;
  height:65px;

  left:230px;
  bottom:28px;

  z-index:8;

  animation:
    empilhadeira-move
    8s
    ease-in-out
    infinite;
}

@keyframes empilhadeira-move{

  0%,100%{
    transform:translateX(0);
  }

  45%{
    transform:translateX(55px);
  }

  65%{
    transform:translateX(55px);
  }
}

.emp-corpo{
  position:absolute;

  bottom:8px;
  left:8px;

  width:45px;
  height:27px;

  background:
    linear-gradient(
      145deg,
      #24445a,
      #102030
    );

  border:1px solid rgba(94,242,214,.45);

  border-radius:4px;
}

.emp-cabine{
  position:absolute;

  bottom:32px;
  left:25px;

  width:28px;
  height:25px;

  border:2px solid #45627b;

  border-bottom:none;

  background:rgba(7,14,21,.7);
}

.emp-teto{
  position:absolute;

  top:-4px;
  left:-3px;

  width:34px;
  height:3px;

  background:#4c657d;
}

.emp-mastro{
  position:absolute;

  bottom:7px;
  right:5px;

  width:4px;
  height:58px;

  background:
    linear-gradient(
      90deg,
      #3b526a,
      #7590a8
    );

  box-shadow:
    0 0 5px rgba(62,166,255,.3);
}

.emp-garfo{
  position:absolute;

  right:-31px;
  bottom:10px;

  width:33px;
  height:3px;

  background:#758ca1;

  box-shadow:
    0 6px 0 #758ca1;
}

.emp-roda{
  position:absolute;

  bottom:0;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#05080c;

  border:2px solid #46586d;
}

.emp-roda.r1{left:12px}
.emp-roda.r2{left:42px}

/* =========================================================
   PALLET
========================================================= */

.pallet{
  position:absolute;

  width:58px;
  height:38px;

  bottom:22px;
  left:95px;

  z-index:7;
}

.pallet-base{
  position:absolute;

  bottom:0;
  left:0;

  width:58px;
  height:7px;

  background:#604c35;

  border:1px solid #846847;
}

.pallet-caixa{
  position:absolute;

  width:25px;
  height:20px;

  background:
    linear-gradient(
      135deg,
      #23445d,
      #122638
    );

  border:1px solid rgba(62,166,255,.45);
}

.pallet-caixa:nth-child(1){
  left:3px;
  bottom:7px;
}

.pallet-caixa:nth-child(2){
  left:30px;
  bottom:7px;
}

.pallet-caixa:nth-child(3){
  left:16px;
  bottom:26px;
}

/* =========================================================
   DOCAS
========================================================= */

.cd-portas{
  position:absolute;

  left:245px;
  right:18px;
  bottom:0;

  height:110px;

  display:flex;
  gap:12px;

  align-items:flex-end;
}

.porta{
  width:62px;
  height:102px;

  border:1px solid rgba(62,166,255,.25);

  border-bottom:none;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(62,166,255,.03) 0px,
      rgba(62,166,255,.03) 8px,
      rgba(62,166,255,.12) 9px,
      rgba(62,166,255,.03) 10px
    ),
    #070c13;

  position:relative;

  overflow:hidden;
}

.porta::before{
  content:"";

  position:absolute;

  width:100%;
  height:2px;

  top:24px;

  background:var(--accent);

  opacity:.35;

  box-shadow:
    0 0 12px var(--accent);
}

.porta span{
  position:absolute;

  width:10px;
  height:10px;

  background:var(--accent-2);

  border-radius:2px;

  bottom:8px;
  left:25px;

  opacity:.5;

  animation:
    scanner-porta
    2.5s
    linear
    infinite;
}

@keyframes scanner-porta{
  0%{
    transform:translateY(0);
    opacity:0;
  }

  20%{opacity:.7}

  80%{opacity:.7}

  100%{
    transform:translateY(-70px);
    opacity:0;
  }
}

/* =========================================================
   ESTEIRA
========================================================= */

.cd-esteira{
  position:absolute;

  width:330px;
  height:82px;

  left:50%;
  bottom:38px;

  transform:translateX(-50%);

  z-index:10;
}

.esteira-base{
  position:absolute;

  left:0;
  right:0;
  bottom:10px;

  height:14px;

  background:
    linear-gradient(
      180deg,
      #2a4057,
      #111b27
    );

  border:1px solid rgba(62,166,255,.35);

  transform:skewX(-12deg);

  box-shadow:
    0 0 18px rgba(62,166,255,.12);
}

.esteira-rolo{
  position:absolute;

  width:8px;
  height:8px;

  bottom:12px;

  border-radius:50%;

  background:#526277;

  box-shadow:
    0 0 5px rgba(62,166,255,.4);

  animation:rolar 1s linear infinite;
}

.r1{left:15px}
.r2{left:70px;animation-delay:.1s}
.r3{left:125px;animation-delay:.2s}
.r4{left:180px;animation-delay:.3s}
.r5{left:235px;animation-delay:.4s}
.r6{left:290px;animation-delay:.5s}

@keyframes rolar{
  to{
    transform:rotate(360deg);
  }
}

/* caixas na esteira */

.caixa{
  position:absolute;

  width:43px;
  height:32px;

  bottom:25px;

  background:
    linear-gradient(
      135deg,
      #1a3b57,
      #0c1d2d
    );

  border:1px solid rgba(62,166,255,.5);

  border-radius:3px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:var(--mono);
  font-size:7px;

  color:var(--accent);

  box-shadow:
    0 6px 15px rgba(0,0,0,.45);
}

.caixa::before{
  content:"";

  position:absolute;

  left:50%;
  top:0;

  width:1px;
  height:100%;

  background:rgba(94,242,214,.2);
}

.caixa-1{
  animation:
    caixa-movimento
    6s
    linear
    infinite;
}

.caixa-2{
  animation:
    caixa-movimento
    6s
    linear
    infinite;

  animation-delay:-2s;
}

.caixa-3{
  animation:
    caixa-movimento
    6s
    linear
    infinite;

  animation-delay:-4s;
}

@keyframes caixa-movimento{

  0%{
    left:-50px;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  85%{
    opacity:1;
  }

  100%{
    left:340px;
    opacity:0;
  }
}

/* =========================================================
   CAMINHÃO
========================================================= */

.cd-caminhao{
  position:absolute;

  width:145px;
  height:58px;

  bottom:48px;
  left:-170px;

  z-index:12;

  animation:
    caminhao-entrega
    13s
    ease-in-out
    infinite;
}

.caminhao-carroceria{
  position:absolute;

  left:0;
  bottom:10px;

  width:102px;
  height:42px;

  background:
    linear-gradient(
      145deg,
      #19334a,
      #0d1722
    );

  border:1px solid rgba(62,166,255,.45);

  border-radius:4px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 8px 18px rgba(0,0,0,.5);
}

.caminhao-carroceria span{
  font-family:var(--mono);

  font-size:7px;

  color:var(--accent);

  letter-spacing:.1em;
}

.caminhao-cabine{
  position:absolute;

  right:0;
  bottom:10px;

  width:45px;
  height:35px;

  background:
    linear-gradient(
      145deg,
      #254861,
      #102232
    );

  border:1px solid rgba(94,242,214,.4);

  border-radius:3px 7px 2px 2px;
}

.caminhao-janela{
  position:absolute;

  right:5px;
  top:5px;

  width:25px;
  height:13px;

  background:#06121d;

  border:1px solid rgba(62,166,255,.45);
}

.roda{
  position:absolute;

  bottom:0;

  width:15px;
  height:15px;

  border-radius:50%;

  background:#05080d;

  border:2px solid #344357;
}

.roda-1{left:18px}
.roda-2{right:10px}

@keyframes caminhao-entrega{

  0%{
    left:-170px;
    opacity:0;
  }

  8%{
    opacity:1;
  }

  32%{
    left:calc(50% - 72px);
  }

  55%{
    left:calc(50% - 72px);
  }

  82%{
    left:calc(100% + 30px);
    opacity:1;
  }

  95%,100%{
    left:calc(100% + 30px);
    opacity:0;
  }
}

/* =========================================================
   LOGIN
========================================================= */

.acesso{
  position:relative;

  flex:1 1 0;
  min-width:340px;

  padding:38px 36px 30px;

  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo-linha{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:26px;
}

.logo-icone{
  position:relative;

  width:44px;
  height:44px;

  flex-shrink:0;

  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #1a2432,
      #0e141c
    );

  border:1px solid rgba(62,166,255,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 0 22px rgba(62,166,255,.25);
}

.logo-icone::after{
  content:"";

  position:absolute;

  inset:-5px;

  border-radius:14px;

  border:1px solid rgba(62,166,255,.3);
}

.logo-icone svg{
  width:22px;
  height:22px;
  position:relative;
}

.marca-texto{
  font-size:15px;
  font-weight:700;
  color:var(--text);
}

.marca-texto span{
  display:block;

  font-family:var(--mono);

  font-size:10px;

  letter-spacing:.16em;

  color:var(--accent-2);

  text-transform:uppercase;

  margin-top:2px;

  font-weight:600;
}

h1{
  font-size:21px;

  margin:0 0 6px;

  font-weight:700;

  background:
    linear-gradient(
      90deg,
      #eef2f7,
      #b9d9ff
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin:0 0 24px;
}

/* =========================================================
   CAMPOS
========================================================= */

.field{
  display:flex;
  flex-direction:column;

  gap:7px;

  margin-bottom:16px;
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
}

.campo-wrap{
  position:relative;
}

.campo-wrap svg{
  position:absolute;

  left:13px;
  top:50%;

  transform:translateY(-50%);

  width:15px;
  height:15px;

  color:#5b6577;

  pointer-events:none;

  transition:color .15s;
}

.field input{
  width:100%;

  background:rgba(6,9,14,.75);

  border:1px solid var(--line);

  border-radius:9px;

  padding:12px 13px 12px 38px;

  color:var(--text);

  font-size:14.5px;

  outline:none;

  transition:
    border-color .15s,
    box-shadow .15s,
    background .15s;
}

.field input::placeholder{
  color:#4c5769;
}

.field input:focus{
  border-color:var(--accent);

  background:rgba(6,9,14,.9);

  box-shadow:
    0 0 0 3px rgba(62,166,255,.15),
    0 0 18px rgba(62,166,255,.12);
}

.campo-wrap:focus-within svg{
  color:var(--accent);
}

/* =========================================================
   BOTÃO
========================================================= */

button{
  width:100%;

  margin-top:10px;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      #2fd7c4
    );

  color:#06121f;

  border:none;

  border-radius:9px;

  padding:13px;

  font-size:14.5px;

  font-weight:700;

  cursor:pointer;

  transition:
    transform .12s,
    box-shadow .12s;

  box-shadow:
    0 6px 20px rgba(62,166,255,.3);
}

button:hover{
  transform:translateY(-1px);

  box-shadow:
    0 8px 26px rgba(62,166,255,.42);
}

button:active{
  transform:translateY(0);
}

button:focus-visible,
.field input:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* =========================================================
   ERRO
========================================================= */

.erro{
  background:rgba(255,107,107,.1);

  border:1px solid rgba(255,107,107,.3);

  color:var(--danger);

  font-size:13px;

  padding:10px 12px;

  border-radius:9px;

  margin-bottom:18px;

  display:flex;
  align-items:center;
  gap:8px;
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:850px){

  .console{
    min-width:420px;
  }

  .cd-predio{
    transform:
      translateX(-50%)
      scale(.88);

    transform-origin:top center;
  }
}

@media(max-width:760px){

  body{
    overflow:auto;
  }

  .card{
    flex-direction:column;
  }

  .console{
    flex:none;

    width:100%;
    min-width:0;

    height:430px;

    border-right:none;
    border-bottom:1px solid var(--line);

    padding:22px 24px;
  }

  .cd-cena{
    min-height:350px;
  }

  .acesso{
    flex:none;

    width:100%;
    min-width:0;

    padding:28px 24px 26px;
  }
}

@media(max-width:520px){

  .cd-predio{
    transform:
      translateX(-50%)
      scale(.72);
  }

  .cd-esteira{
    transform:
      translateX(-50%)
      scale(.75);
  }

  .empilhadeira{
    display:none;
  }
}

@media(max-width:420px){

  body{
    padding:12px;
  }

  .console{
    display:none;
  }

  .acesso{
    padding:30px 22px 24px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     FUNDO
======================================================= -->

<div class="aurora">
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="grade"></div>

<div id="particulas"></div>


<!-- =======================================================
     LOGIN
======================================================= -->

<div class="envoltorio">

  <div class="card">


    <!-- ===================================================
         CENTRO DE DISTRIBUIÇÃO
    ==================================================== -->

    <div class="console">

      <div class="cd-topo">

        <div class="cd-status">

          <span class="console-luz verde"></span>

          <span class="cd-status-text">
            CENTRO DE DISTRIBUIÇÃO
          </span>

        </div>

        <span class="cd-live">
          ● LIVE
        </span>

      </div>


      <div class="cd-cena">


        <!-- =================================================
             GALPÃO
        ================================================== -->

        <div class="cd-predio">

          <div class="cd-telhado"></div>

          <div class="cd-fachada">


            <!-- LOGO -->

            <div class="cd-logo-predio">

              <span>CD</span>

              <small>
                LOGÍSTICA
              </small>

            </div>


            <!-- LUZES -->

            <div class="cd-luzes">
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
            </div>


            <!-- =================================================
                 PRATELEIRAS
            ================================================== -->

            <div class="prateleiras">

              <div class="prateleira p1">

                <div class="estoque-caixa c1"></div>
                <div class="estoque-caixa c2"></div>
                <div class="estoque-caixa c3"></div>
                <div class="estoque-caixa c4"></div>
                <div class="estoque-caixa c5"></div>

              </div>


              <div class="prateleira p2">

                <div class="estoque-caixa c2"></div>
                <div class="estoque-caixa c3"></div>
                <div class="estoque-caixa c4"></div>
                <div class="estoque-caixa c5"></div>
                <div class="estoque-caixa c6"></div>

              </div>


              <div class="prateleira p3">

                <div class="estoque-caixa c1"></div>
                <div class="estoque-caixa c3"></div>
                <div class="estoque-caixa c4"></div>
                <div class="estoque-caixa c5"></div>

              </div>

            </div>


            <!-- =================================================
                 DOCAS
            ================================================== -->

            <div class="cd-portas">

              <div class="porta">
                <span></span>
              </div>

              <div class="porta">
                <span></span>
              </div>

            </div>

          </div>

        </div>


        <!-- =================================================
             PALLET
        ================================================== -->

        <div class="pallet">

          <div class="pallet-base"></div>

          <div class="pallet-caixa"></div>
          <div class="pallet-caixa"></div>
          <div class="pallet-caixa"></div>

        </div>


        <!-- =================================================
             EMPILHADEIRA
        ================================================== -->

        <div class="empilhadeira">

          <div class="emp-corpo"></div>

          <div class="emp-cabine"></div>

          <div class="emp-teto"></div>

          <div class="emp-mastro"></div>

          <div class="emp-garfo"></div>

          <div class="emp-roda r1"></div>
          <div class="emp-roda r2"></div>

        </div>


        <!-- =================================================
             ESTEIRA
        ================================================== -->

        <div class="cd-esteira">

          <div class="esteira-base"></div>

          <div class="esteira-rolo r1"></div>
          <div class="esteira-rolo r2"></div>
          <div class="esteira-rolo r3"></div>
          <div class="esteira-rolo r4"></div>
          <div class="esteira-rolo r5"></div>
          <div class="esteira-rolo r6"></div>


          <div class="caixa caixa-1">
            BOX
          </div>

          <div class="caixa caixa-2">
            BOX
          </div>

          <div class="caixa caixa-3">
            BOX
          </div>

        </div>


        <!-- =================================================
             CAMINHÃO
        ================================================== -->

        <div class="cd-caminhao">

          <div class="caminhao-carroceria">
            <span>ESTOQUE</span>
          </div>

          <div class="caminhao-cabine">

            <div class="caminhao-janela"></div>

          </div>

          <div class="roda roda-1"></div>
          <div class="roda roda-2"></div>

        </div>

      </div>

    </div>


    <!-- ===================================================
         LOGIN
    ==================================================== -->

    <div class="acesso">

      <div class="logo-linha">

        <div class="logo-icone">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            <path
              d="M12 2L21 7V17L12 22L3 17V7L12 2Z"
              stroke="#3ea6ff"
              stroke-width="1.6"
              stroke-linejoin="round"
            />

            <path
              d="M3 7L12 12L21 7"
              stroke="#5ef2d6"
              stroke-width="1.6"
              stroke-linejoin="round"
            />

            <path
              d="M12 12V22"
              stroke="#3ea6ff"
              stroke-width="1.6"
            />

          </svg>

        </div>


        <div class="marca-texto">

          Controle de Ativos

          <span>
            Sistema interno
          </span>

        </div>

      </div>


      <h1>
        Acessar o sistema
      </h1>

      <p class="sub">
        Entre com suas credenciais para continuar.
      </p>


      {% if erro %}

      <div class="erro">
        ⚠ {{ erro }}
      </div>

      {% endif %}


      <form method="POST">

        <div class="field">

          <label for="username">
            Usuário
          </label>

          <div class="campo-wrap">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              stroke="currentColor"
              stroke-width="1.8"
            >

              <circle
                cx="12"
                cy="8"
                r="3.2"
              />

              <path
                d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"
              />

            </svg>


            <input
              id="username"
              name="username"
              placeholder="seu.usuario"
              autofocus
              required
            >

          </div>

        </div>


        <div class="field">

          <label for="password">
            Senha
          </label>

          <div class="campo-wrap">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              stroke="currentColor"
              stroke-width="1.8"
            >

              <rect
                x="4.5"
                y="10.5"
                width="15"
                height="9.5"
                rx="2"
              />

              <path
                d="M8 10.5V7.5a4 4 0 0 1 8 0v3"
              />

            </svg>


            <input
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              required
            >

          </div>

        </div>


        <button type="submit">
          Entrar
        </button>

      </form>


      <div class="credito">

        © 2026 · Todos os direitos reservados ·
        Developed by
        <strong>Alexandre Martins</strong>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   PARTÍCULAS DO FUNDO
========================================================= */

const container =
  document.getElementById("particulas");

for(let i = 0; i < 14; i++){

  const p =
    document.createElement("div");

  p.className =
    "particula";

  const tamanho =
    2 + Math.random() * 2.5;

  p.style.width =
    tamanho + "px";

  p.style.height =
    tamanho + "px";

  p.style.left =
    Math.random() * 100 + "vw";

  p.style.bottom =
    "-10px";

  p.style.animationDuration =
    (10 + Math.random() * 12) + "s";

  p.style.animationDelay =
    (Math.random() * 12) + "s";

  container.appendChild(p);

}

</script>

</body>
</html>
