<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Controle de Estoque</title>
<style>
  :root{
    --bg:#12181f; --panel:#1a2029; --panel-2:#212934; --line:#2b3444;
    --text:#e7ebf1; --muted:#8b96a8; --accent:#3ea6ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:32px 30px; width:min(360px, 90vw);
  }
  .tag{
    font-family:"SFMono-Regular", Consolas, monospace; font-size:12px; letter-spacing:.12em;
    color:var(--accent); text-transform:uppercase; margin-bottom:6px; display:block;
  }
  h1{font-size:19px; margin:0 0 22px; font-weight:600;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:12px; color:var(--muted);}
  .field input{
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding:10px 11px; color:var(--text); font-size:14px; outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  button{
    width:100%; margin-top:8px; background:var(--accent); color:#08131f;
    border:none; border-radius:6px; padding:11px; font-size:14px; font-weight:600;
    cursor:pointer;
  }
  button:hover{opacity:.9;}
  .erro{
    background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.3);
    color:var(--danger); font-size:13px; padding:9px 11px; border-radius:6px; margin-bottom:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="tag">Estoque</span>
    <h1>Entrar no sistema</h1>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <form method="POST">
      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" name="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <div style="text-align:center; margin-top:16px; font-size:11px; letter-spacing:.04em; color:var(--muted);">
    © 2026 · Todos os direitos reservados · Developed by <strong style="color:var(--accent); font-weight:600;">Alexandre Martins</strong>
  </div>
</body>
</html>
