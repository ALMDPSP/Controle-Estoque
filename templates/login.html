<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Controle de Estoque</title>
<style>
  :root{
    --bg:#080b10; --panel:#10151d; --line:rgba(255,255,255,.09);
    --text:#eef2f7; --muted:#8b96a8; --accent:#3ea6ff; --accent-2:#5ef2d6; --danger:#ff6b6b;
    --mono:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow-x:hidden;
  }

  /* ---------- Fundo ---------- */
  .aurora{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:.22;
    animation:flutuar 16s ease-in-out infinite;
  }
  .aurora span:nth-child(1){width:520px; height:520px; background:#3ea6ff; top:-200px; left:-140px;}
  .aurora span:nth-child(2){width:460px; height:460px; background:#5ef2d6; bottom:-180px; right:-120px; animation-delay:-6s;}
  .aurora span:nth-child(3){width:340px; height:340px; background:#8a5ef2; top:35%; left:55%; animation-delay:-11s; opacity:.14;}
  @keyframes flutuar{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-30px) scale(1.08);}}

  .grade{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, black 40%, transparent 88%);
  }

  .particula{
    position:fixed; z-index:0; border-radius:50%; background:var(--accent);
    box-shadow:0 0 8px 1px rgba(62,166,255,.7);
    animation:subir-particula linear infinite;
    opacity:0;
  }
  @keyframes subir-particula{
    0%{transform:translateY(0); opacity:0;}
    10%{opacity:.7;}
    90%{opacity:.5;}
    100%{transform:translateY(-100vh); opacity:0;}
  }

  /* ---------- Cartão ---------- */
  .envoltorio{
    position:relative; z-index:1; width:min(860px, 100%);
    animation:subir-fade .5s ease-out both;
  }
  @keyframes subir-fade{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .card{
    position:relative;
    display:flex;
    background:rgba(14,19,27,.98);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    overflow:hidden;
  }
  /* borda com "scan" girando */
  .card::before{
    content:''; position:absolute; inset:0; z-index:0; padding:1.5px; border-radius:18px;
    background:conic-gradient(from 0deg, transparent 0%, rgba(62,166,255,.9) 8%, transparent 20%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:girar 4.5s linear infinite;
    pointer-events:none;
  }
  @keyframes girar{to{transform:rotate(360deg);}}

  /* ---------- Painel esquerdo: console ---------- */
  .console{
    position:relative; flex:1 1 0; min-width:320px;
    background:linear-gradient(160deg, #0c1119, #080b10);
    border-right:1px solid var(--line);
    padding:32px 30px;
    display:flex; flex-direction:column;
  }
  .console-topo{display:flex; align-items:center; gap:9px; margin-bottom:22px;}
  .console-luz{width:9px; height:9px; border-radius:50%; background:#3a4453;}
  .console-luz.verde{background:var(--accent-2); box-shadow:0 0 8px rgba(94,242,214,.7); animation:pulsar 1.8s ease-in-out infinite;}
  @keyframes pulsar{0%,100%{opacity:.5;} 50%{opacity:1;}}
  .console-titulo{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; margin-left:4px;}

  .console-corpo{
    font-family:var(--mono); font-size:12.5px; line-height:2; flex:1;
    display:flex; flex-direction:column; justify-content:center; min-height:200px;
  }
  .console-linha{color:var(--muted); opacity:0; white-space:nowrap; overflow:hidden;}
  .console-linha .ok{color:var(--accent-2);}
  .console-linha .num{color:var(--accent); font-weight:600;}
  .cursor{display:inline-block; width:7px; height:14px; background:var(--accent-2); margin-left:2px; vertical-align:middle; animation:piscar 1s step-end infinite;}
  @keyframes piscar{0%,49%{opacity:1;} 50%,100%{opacity:0;}}

  .console-rodape{
    margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:10.5px; color:#4c5769; letter-spacing:.04em;
    display:flex; justify-content:space-between;
  }

  /* ---------- Painel direito: formulário ---------- */
  .acesso{
    position:relative; flex:1 1 0; min-width:340px;
    padding:38px 36px 30px;
    display:flex; flex-direction:column; justify-content:center;
  }

  .logo-linha{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
  .logo-icone{
    position:relative; width:44px; height:44px; flex-shrink:0;
    border-radius:11px;
    background:linear-gradient(145deg, #1a2432, #0e141c);
    border:1px solid rgba(62,166,255,.35);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.02) inset, 0 0 22px rgba(62,166,255,.25);
  }
  .logo-icone::after{
    content:''; position:absolute; inset:-5px; border-radius:14px;
    border:1px solid rgba(62,166,255,.3);
  }
  .logo-icone svg{width:22px; height:22px; position:relative;}

  .marca-texto{font-size:15px; font-weight:700; letter-spacing:-.005em; color:var(--text);}
  .marca-texto span{
    display:block; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
    color:var(--accent-2); text-transform:uppercase; margin-top:2px; font-weight:600;
  }

  h1{
    font-size:21px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em;
    background:linear-gradient(90deg, #eef2f7, #b9d9ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--muted); font-size:13px; margin:0 0 24px;}

  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:16px;}
  .field label{font-size:12px; color:var(--muted); font-weight:500; letter-spacing:.01em;}
  .campo-wrap{position:relative;}
  .campo-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:#5b6577; pointer-events:none; transition:color .15s;
  }
  .field input{
    width:100%; background:rgba(6,9,14,.75); border:1px solid var(--line); border-radius:9px;
    padding:12px 13px 12px 38px; color:var(--text); font-size:14.5px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .field input::placeholder{color:#4c5769;}
  .field input:focus{
    border-color:var(--accent); background:rgba(6,9,14,.9);
    box-shadow:0 0 0 3px rgba(62,166,255,.15), 0 0 18px rgba(62,166,255,.12);
  }
  .campo-wrap:focus-within svg{color:var(--accent);}

  button{
    width:100%; margin-top:10px;
    background:linear-gradient(90deg, var(--accent), #2fd7c4);
    color:#06121f; border:none; border-radius:9px; padding:13px; font-size:14.5px; font-weight:700;
    cursor:pointer; transition:transform .12s, box-shadow .12s;
    box-shadow:0 6px 20px rgba(62,166,255,.3); letter-spacing:.01em;
  }
  button:hover{transform:translateY(-1px); box-shadow:0 8px 26px rgba(62,166,255,.42);}
  button:active{transform:translateY(0);}
  button:focus-visible, .field input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .erro{
    background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.3);
    color:var(--danger); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:18px;
    display:flex; align-items:center; gap:8px;
  }

  .credito{
    text-align:center; margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
    font-size:10.5px; letter-spacing:.03em; color:#5b6577;
  }
  .credito strong{color:var(--accent-2); font-weight:600;}

  @media (max-width: 760px){
    .card{flex-direction:column;}
    .console{flex:none; width:100%; min-width:0; border-right:none; border-bottom:1px solid var(--line); padding:22px 24px;}
    .console-corpo{min-height:0;}
    .acesso{flex:none; width:100%; min-width:0; padding:28px 24px 26px;}
  }
  @media (max-width: 420px){
    .console{display:none;}
  }
</style>
</head>
<body>

  <div class="aurora"><span></span><span></span><span></span></div>
  <div class="grade"></div>
  <div id="particulas"></div>

  <div class="envoltorio">
    <div class="card">

      <div class="console">
        <div class="console-topo">
          <span class="console-luz verde"></span>
          <span class="console-luz"></span>
          <span class="console-luz"></span>
          <span class="console-titulo">status.log</span>
        </div>
        <div class="console-corpo" id="console-corpo"></div>
        <div class="console-rodape">
          <span>build 2026.08</span>
          <span>SLA 99.9%</span>
        </div>
      </div>

      <div class="acesso">
        <div class="logo-linha">
          <div class="logo-icone">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#3ea6ff" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M3 7L12 12L21 7" stroke="#5ef2d6" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M12 12V22" stroke="#3ea6ff" stroke-width="1.6"/>
            </svg>
          </div>
          <div class="marca-texto">Controle de Ativos<span>Sistema interno</span></div>
        </div>

        <h1>Acessar o sistema</h1>
        <p class="sub">Entre com suas credenciais para continuar.</p>

        {% if erro %}<div class="erro">⚠ {{ erro }}</div>{% endif %}

        <form method="POST">
          <div class="field">
            <label for="username">Usuário</label>
            <div class="campo-wrap">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="8" r="3.2"/>
                <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/>
              </svg>
              <input id="username" name="username" placeholder="seu.usuario" autofocus required>
            </div>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <div class="campo-wrap">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
                <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
              </svg>
              <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit">Entrar</button>
        </form>

        <div class="credito">© 2026 · Todos os direitos reservados · Developed by <strong>Alexandre Martins</strong></div>
      </div>

    </div>
  </div>

<script>
// Partículas subindo no fundo
const container = document.getElementById('particulas');
for(let i = 0; i < 14; i++){
  const p = document.createElement('div');
  p.className = 'particula';
  const tamanho = 2 + Math.random() * 2.5;
  p.style.width = tamanho + 'px';
  p.style.height = tamanho + 'px';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.bottom = '-10px';
  p.style.animationDuration = (10 + Math.random() * 12) + 's';
  p.style.animationDelay = (Math.random() * 12) + 's';
  container.appendChild(p);
}

// Console com linhas aparecendo em sequência (efeito "máquina de escrever")
const linhas = [
  'auth.service — inicializando',
  'tls — handshake concluído',
  'estoque.db — <span class="ok">conectado</span>',
  'imobilizados.db — <span class="ok">conectado</span>',
  'aguardando credenciais<span class="cursor"></span>',
];
const corpo = document.getElementById('console-corpo');
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function montarConsole(){
  linhas.forEach((texto, i) => {
    const div = document.createElement('div');
    div.className = 'console-linha';
    div.innerHTML = '<span style="color:#3ea6ff;">&gt;</span> ' + texto;
    corpo.appendChild(div);
    if(prefersReduced){
      div.style.opacity = '1';
    } else {
      setTimeout(() => { div.style.transition = 'opacity .3s'; div.style.opacity = '1'; }, i * 480);
    }
  });
}
montarConsole();
</script>

</body>
</html>
