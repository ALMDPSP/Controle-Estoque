<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico · Controle de Estoque</title><style>:root{--bg:#12181f;--panel:#1a2029;--panel-2:#212934;--line:#2b3444;--text:#e7ebf1;--muted:#8b96a8;--accent:#3ea6ff;--accent-2:#ffb648;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",sans-serif}header{padding:26px 32px 18px;border-bottom:1px solid var(--line)}h1{margin:6px 0 3px}.tag{font-size:12px;color:var(--accent-2);border:1px solid var(--accent-2);padding:2px 8px;border-radius:3px}header p{color:var(--muted);margin:0;font-size:13px}main{padding:24px 32px 54px;max-width:1400px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text);font-size:12px;outline:none}.tools input{min-width:320px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:10px;text-transform:uppercase}td code{color:var(--accent)}.badge{padding:3px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:10px}footer{text-align:center;color:var(--muted);font-size:12px;padding:0 32px 18px}footer strong{color:var(--accent)}@media(max-width:700px){header,main,footer{padding-left:16px;padding-right:16px}.tools input{min-width:100%}.table-wrap{overflow:auto}}</style></head><body><header><span class="tag">AUDITORIA</span><h1>Histórico de movimentações</h1><p>Rastreie quem fez cada entrada, edição, saída, exclusão ou restauração.</p></header>{% include '_menu.html' %}<main><section class="panel"><div class="tools"><input id="q" placeholder="Filtrar por código, descrição, usuário ou observação"><select id="origem"><option value="">Todas as origens</option><option value="itens">Estoque</option><option value="imobilizados">Imobilizados</option></select><select id="tipo"><option value="">Todos os tipos</option></select><input type="date" id="inicio"><input type="date" id="fim"><button id="imprimir" style="background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text);cursor:pointer">Imprimir / PDF</button></div><div class="table-wrap"><table><thead><tr><th>Data/hora</th><th>Origem</th><th>Item</th><th>Tipo</th><th>Qtd.</th><th>Usuário</th><th>Observação</th></tr></thead><tbody id="tb"></tbody></table></div></section></main><footer>Arquivo de dados: <strong>estoque.xlsx</strong><div style="margin-top:14px">© 2026 · Todos os direitos reservados · Developed by <strong>Alexandre Martins</strong></div></footer><script>let movs=[];const norm=s=>String(s||'').toLowerCase();function render(){const q=norm(document.getElementById('q').value),o=document.getElementById('origem').value,t=document.getElementById('tipo').value,i=document.getElementById('inicio').value,f=document.getElementById('fim').value;const arr=movs.filter(m=>{const d=String(m.data_hora||'').slice(0,10);return (!o||(m.tabela||'itens')===o)&&(!t||m.tipo===t)&&(!i||d>=i)&&(!f||d<=f)&&(!q||norm(`${m.codigo} ${m.descricao} ${m.usuario} ${m.observacao} ${m.tipo}`).includes(q))});document.getElementById('tb').innerHTML=arr.map(m=>`<tr><td>${m.data_hora||''}</td><td>${m.tabela==='imobilizados'?'Imobilizados':'Estoque'}</td><td><code>${m.codigo||'#'+m.item_id}</code><br>${m.descricao||''}</td><td><span class="badge">${m.tipo||''}</span></td><td>${m.quantidade||''}</td><td>${m.usuario||''}</td><td>${m.observacao||''}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">Nenhuma movimentação encontrada.</td></tr>'}fetch('/api/movimentacoes-recentes?limite=500').then(r=>r.json()).then(x=>{movs=x;const tipos=[...new Set(x.map(m=>m.tipo).filter(Boolean))].sort();document.getElementById('tipo').innerHTML='<option value="">Todos os tipos</option>'+tipos.map(t=>`<option>${t}</option>`).join('');render()});['q','origem','tipo','inicio','fim'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('imprimir').addEventListener('click',()=>window.print());</script></body></html>
